name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26

    # The macos-15 image stops at Xcode 16.4, which cannot open this project.
    # Pinned to the version the README states as the minimum, so CI proves that
    # requirement is truthful rather than testing whatever the image defaults to.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Simulator names change with every Xcode release, so the destination is
      # resolved at run time rather than pinned to whatever this month's runner
      # image happens to ship.
      - name: Choose a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in runtimes[runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no available iPhone simulator")
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep -F "$udid"

      # The runner launches the simulator cold, and a cold launch loses a race
      # often enough to matter: xcodebuild exits 65 with "Application failed
      # preflight checks" while the device is still coming up. Booting it
      # first and waiting removes most of that, and the retry below covers the
      # rest — it retries only that specific failure, never a real test failure.
      - name: Boot the simulator
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Test
        run: |
          set -uo pipefail
          udid="${{ steps.sim.outputs.udid }}"

          for attempt in 1 2 3; do
            rm -rf TestResults.xcresult
            if xcodebuild \
                 -project VoleCast.xcodeproj \
                 -scheme VoleCast \
                 -destination "platform=iOS Simulator,id=$udid" \
                 -resultBundlePath TestResults.xcresult \
                 test 2>&1 | tee xcodebuild.log; then
              exit 0
            fi

            if grep -q "failed preflight checks" xcodebuild.log; then
              echo "::warning::Simulator refused to launch on attempt $attempt; resetting it and retrying."
              xcrun simctl shutdown "$udid" || true
              sleep 10
              xcrun simctl bootstatus "$udid" -b || true
              continue
            fi

            # Surface the failures themselves. Without this the only thing
            # visible outside the raw log — which needs admin rights to read —
            # is "exit code 1", which says nothing about what broke.
            echo "--- failures ---"
            grep -E "^.*(✘|error:|Fatal error)" xcodebuild.log | head -40 || true
            grep -E "✘ Test .* recorded an issue" xcodebuild.log | head -20 | while read -r line; do
              echo "::error::${line}"
            done
            grep -E "^/.*error: " xcodebuild.log | head -10 | while read -r line; do
              echo "::error::${line}"
            done
            echo "::error::Tests failed. See the annotations above, or the xcodebuild.log artifact."
            exit 1
          done

          echo "::error::The simulator would not start after three attempts."
          exit 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log

  signing-values:
    name: No personal signing values
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # .githooks/pre-commit strips these, but it only runs for contributors who
      # opted in with `git config core.hooksPath .githooks`. This is the part
      # nobody can forget to enable.
      - name: Check for a committed team ID or bundle prefix
        run: |
          if git grep -nE 'DEVELOPMENT_TEAM[[:space:]]*=[[:space:]]*[A-Z0-9]{6,}' -- . ; then
            echo "::error::A Development Team ID is committed. It belongs in Config/Local.xcconfig, which is git-ignored."
            exit 1
          fi
          if git grep -nE 'PRODUCT_BUNDLE_IDENTIFIER[[:space:]]*=[[:space:]]*"?[a-z]+\.[a-zA-Z0-9]+\.' -- '*.pbxproj' ; then
            echo "::error::A literal bundle identifier is committed. Use \$(ORG_IDENTIFIER)."
            exit 1
          fi
          echo "No personal signing values found."
